<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لسان القرآن · ക്ലാസ് 5</title>
<style>
:root{
  --navy:#0f2a4a;
  --navy2:#173b67;
  --blue:#2a7fc9;
  --blue2:#4a9fe0;
  --sky:#eaf5ff;
  --yellow:#ffe27a;
  --green:#16845b;
  --green-bg:#e4f4eb;
  --red:#c64242;
  --ink:#182538;
  --muted:#5d6b7b;
  --card:#ffffff;
  --line:#d7e3ef;
  --shadow:0 8px 30px rgba(23,59,103,.08);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,"Noto Sans Malayalam","Noto Sans Arabic",sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #dfeeff 0%, transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, #e8f7ee 0%, transparent 55%),
    #f2f7fc;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* ---------- Header ---------- */
header{
  background:linear-gradient(135deg,#0d2440 0%,#173b67 40%,#2a7fc9 100%);
  color:#fff;
  padding:26px 18px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
header::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.12), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(255,226,122,.10), transparent 40%);
  pointer-events:none;
}
header h1{
  font-size:clamp(24px,4vw,34px);
  margin:0 0 6px;
  letter-spacing:.3px;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
  position:relative;
}
header p{
  margin:0;
  font-size:clamp(13px,2vw,15px);
  opacity:.92;
  position:relative;
}
/* ---------- Layout ---------- */
main{
  max-width:1040px;
  margin:0 auto;
  padding:22px 14px 60px;
}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
h2{
  font-size:clamp(18px,2.6vw,22px);
  margin:0 0 14px;
  color:var(--navy);
  display:flex;align-items:center;gap:8px;
}
/* ---------- Lesson grid (menu) ---------- */
.lesson-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
}
.lesson{
  position:relative;
  border:2px solid var(--line);
  background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);
  border-radius:14px;
  padding:14px 14px 12px;
  text-align:left;
  cursor:pointer;
  min-height:96px;
  color:var(--ink);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  font-family:inherit;
}
.lesson:hover{
  transform:translateY(-3px);
  border-color:var(--blue);
  box-shadow:0 10px 24px rgba(42,127,201,.14);
  background:var(--sky);
}
.lesson.active{
  border-color:var(--blue);
  background:linear-gradient(180deg,#eaf5ff 0%,#dceefc 100%);
  box-shadow:0 6px 20px rgba(42,127,201,.18);
}
.lesson .num{
  display:inline-grid;place-items:center;
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#ffe27a,#ffc93c);
  color:#5a3d00;
  font-weight:900;
  font-size:14px;
  margin-right:8px;
  box-shadow:0 3px 8px rgba(255,201,60,.35);
}
.lesson .mltitle{
  font-weight:750;
  display:block;
  margin:10px 0 4px;
  font-size:15px;
  line-height:1.35;
}
.lesson .arabic{
  font-family:"Noto Naskh Arabic","Amiri",serif;
  font-size:18px;
  direction:rtl;
  color:#a34b26;
  line-height:1.5;
}
/* ---------- Work area ---------- */
#workArea{display:none}
.topline{
  display:flex;
  gap:14px;
  align-items:flex-start;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-bottom:6px;
}
#lessonHeading{margin-bottom:6px}
.pill{
  background:var(--green-bg);
  color:#176b4c;
  border-radius:99px;
  padding:7px 14px;
  font-weight:800;
  font-size:13px;
  white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(22,132,91,.15);
}
.progress{
  height:10px;
  background:#e4ebf2;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0 18px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.05);
}
.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#22a06b,#3dc98c);
  border-radius:99px;
  transition:width .35s cubic-bezier(.2,.8,.2,1);
}
/* ---------- Questions ---------- */
.question{
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin:14px 0;
  background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  box-shadow:0 2px 10px rgba(23,59,103,.04);
  animation:fadeUp .35s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qnum{
  color:var(--blue);
  font-weight:800;
  font-size:12px;
  letter-spacing:.4px;
  text-transform:uppercase;
}
.prompt{
  font-size:clamp(15px,2.3vw,17px);
  font-weight:750;
  margin:8px 0 12px;
  line-height:1.6;
}
.ml{
  font-family:"Noto Naskh Arabic","Amiri",serif;
  direction:rtl;
  text-align:right;
  font-size:clamp(20px,3vw,24px);
  line-height:1.9;
  color:#243b55;
}
.options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:9px;
  margin-top:6px;
}
.option{
  border:1.5px solid #cad8e7;
  border-radius:11px;
  padding:11px 12px;
  background:#fafdff;
  cursor:pointer;
  font-size:16px;
  min-height:48px;
  color:var(--ink);
  font-family:inherit;
  transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  text-align:center;
}
.option:hover{
  border-color:var(--blue);
  background:#edf6ff;
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(42,127,201,.10);
}
.option.correct{
  background:#baf2ce!important;
  border:2px solid #16845b!important;
  color:#105b37!important;
  font-weight:700;
  box-shadow:0 4px 12px rgba(22,132,91,.18);
}
.option.wrong{
  background:#ffcaca!important;
  border:2px solid #c64242!important;
  color:#8d1717!important;
  animation:shake .3s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}
.option:disabled{cursor:default;opacity:1;transform:none!important;box-shadow:none!important}
.feedback{
  font-weight:700;
  margin-top:12px;
  min-height:24px;
  font-size:14px;
  line-height:1.5;
  padding:0 2px;
}
.feedback.good{color:var(--green)}
.feedback.bad{color:var(--red)}
/* ---------- Actions ---------- */
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
button.primary,button.secondary{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  font-family:inherit;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.primary{
  background:linear-gradient(135deg,#2a7fc9,#4a9fe0);
  color:#fff;
  box-shadow:0 6px 16px rgba(42,127,201,.28);
}
.secondary{
  background:#e8eef5;
  color:#243b55;
}
.primary:hover,.secondary:hover{
  transform:translateY(-2px);
  filter:brightness(1.03);
  box-shadow:0 8px 20px rgba(42,127,201,.22);
}
.primary:active,.secondary:active{transform:translateY(0)}
#result{
  font-size:clamp(15px,2.2vw,18px);
  font-weight:800;
  margin-top:14px;
  padding:14px 16px;
  border-radius:12px;
  background:linear-gradient(180deg,#f4f9ff,#eaf5ff);
  color:var(--navy2);
  line-height:1.5;
}
#result:empty{display:none}
/* ---------- Footer ---------- */
footer{
  text-align:center;
  color:var(--muted);
  font-size:12.5px;
  padding:16px;
  letter-spacing:.3px;
  border-top:1px solid var(--line);
  background:#fff;
}
@media(max-width:480px){
  main{padding:14px 10px 40px}
  .panel{padding:14px}
  .prompt{font-size:15.5px}
  .options{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .option{font-size:15px;min-height:44px;padding:10px}
}
</style>
</head>

</main>

let current=0, answers={}, checked={};
const $=id=>document.getElementById(id);

function renderLessons(){
  $('lessonList').innerHTML = lessons.map((l,i)=>`
    <button class="lesson ${i===current?'active':''}" onclick="openLesson(${i})">
      <span class="num">${i+1}</span>
      <b style="font-size:13px;opacity:.7">പാഠം ${i+1}</b>
      <span class="mltitle">${l.title}</span>
      <span class="arabic">${l.ar}</span>
    </button>`).join('');
}

function openLesson(i){
  current=i; answers={}; checked={};
  renderLessons();
  $('workArea').style.display='block';
  $('lessonHeading').textContent = `പാഠം ${i+1} — ${lessons[i].title}`;
  $('topicHeading').textContent = lessons[i].topic;
  $('result').textContent='';
  $('scorePill').textContent = `0 / ${lessons[i].qs.length} ശരി`;
  renderQuestions();
  $('workArea').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderQuestions(){
  const l = lessons[current];
  $('questions').innerHTML = l.qs.map((q,qi)=>`
    <div class="question" id="q${qi}">
      <div class="qnum">ആക്ടിവിറ്റി ${qi+1} / ${l.qs.length}</div>
      <div class="prompt">${q[0]}</div>
      ${/[\u0600-\u06FF]/.test(q[1])&&q[1].includes(' ') ? `<div class="ml" style="margin-bottom:10px">${q[1]}</div>` : ''}
      <div class="options">
        ${q.slice(1,5).map((op,oi)=>`
          <button class="option ${/[\u0600-\u06FF]/.test(op)?'ml':''}"
                  onclick="choose(${qi},${oi})" id="o${qi}_${oi}">${op}</button>`).join('')}
      </div>
      <div class="feedback" id="f${qi}"></div>
    </div>`).join('');
  updateProgress();
}

function choose(qi,oi){
  if(checked[qi]) return;
  answers[qi]=oi;
  const q = lessons[current].qs[qi];
  const feedback = $('f'+qi);
  for(let j=0;j<4;j++){
    const b=$('o'+qi+'_'+j);
    b.classList.remove('correct','wrong');
    b.style.outline='none';
  }
  if(oi===q[5]){
    $('o'+qi+'_'+oi).classList.add('correct');
    checked[qi]=true;
    for(let j=0;j<4;j++) $('o'+qi+'_'+j).disabled=true;
    feedback.textContent = 'ശരിയാണ്! ⭐ ' + q[6];
    feedback.className = 'feedback good';
  } else {
    $('o'+qi+'_'+oi).classList.add('wrong');
    $('o'+qi+'_'+q[5]).classList.add('correct');
    feedback.textContent = 'തെറ്റാണ്. ചുവപ്പ് നിറത്തിലുള്ളത് തെറ്റായ ഉത്തരം; പച്ച നിറത്തിലുള്ളത് ശരിയുത്തരം. ' + q[6] + ' വീണ്ടും ശ്രമിക്കൂ.';
    feedback.className = 'feedback bad';
  }
  updateProgress();
}

function checkAll(){
  let score=0;
  const l = lessons[current];
  l.qs.forEach((q,qi)=>{
    checked[qi]=true;
    for(let j=0;j<4;j++){
      const b=$('o'+qi+'_'+j);
      b.classList.remove('correct','wrong');
      b.style.outline='none';
      if(j===q[5]) b.classList.add('correct');
      b.disabled=true;
    }
    const f=$('f'+qi);
    if(answers[qi]===q[5]){
      score++;
      f.textContent='ശരി! ⭐ '+q[6];
      f.className='feedback good';
    } else {
      f.textContent='ശരിയുത്തരം: '+q[q[5]+1]+'. '+q[6];
      f.className='feedback bad';
      if(answers[qi]!==undefined) $('o'+qi+'_'+answers[qi]).classList.add('wrong');
    }
  });
  $('scorePill').textContent = score+' / '+l.qs.length+' ശരി';
  $('result').textContent = score===l.qs.length
    ? 'മിടുക്കൻ / മിടുക്കി! എല്ലാ ഉത്തരങ്ങളും ശരിയാണ്! 🎉'
    : `നിങ്ങൾക്ക് ${l.qs.length}ൽ ${score} ശരി. തെറ്റിയവ വീണ്ടും പഠിച്ചുനോക്കൂ!`;
  updateProgress();
}

function updateProgress(){
  const total=lessons[current].qs.length;
  const n=Object.keys(answers).length;
  $('progressBar').style.width=(n/total*100)+'%';
  if(!Object.keys(checked).length)
    $('scorePill').textContent = n+' / '+total+' തിരഞ്ഞെടുത്തു';
}

function resetLesson(){ openLesson(current); }
function nextLesson(){ openLesson((current+1)%lessons.length); }

renderLessons();
</script>
